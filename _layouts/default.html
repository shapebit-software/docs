<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="ShapeBit home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>ShapeBit <strong>Docs</strong></span>
      </a>
      <button class="navigation-toggle" type="button" aria-controls="site-navigation" aria-expanded="false">
        Menu
      </button>
    </header>

    <div class="site-shell">
      <aside class="sidebar" id="site-navigation">
        <nav aria-label="Documentation navigation">
          <a class="nav-link{% if page.url == '/docs/' %} active{% endif %}" href="{{ '/docs/' | relative_url }}">Introduction</a>

          <details class="nav-group"{% unless page.url == '/docs/' %} open{% endunless %}>
            <summary>Architecture</summary>
            <a class="nav-link nav-link-small{% if page.path == 'docs/Architecture.md' %} active{% endif %}" href="{{ '/docs/architecture/' | relative_url }}">Overview</a>
            <a class="nav-link nav-link-small{% if page.path == 'docs/base-system.md' %} active{% endif %}" href="{{ '/docs/base-system/' | relative_url }}">Base System</a>
            <a class="nav-link nav-link-small{% if page.path == 'docs/boot-system-lifecycle.md' %} active{% endif %}" href="{{ '/docs/boot-system-lifecycle/' | relative_url }}">Boot and System Lifecycle</a>
            <a class="nav-link nav-link-small{% if page.path == 'docs/security-identity.md' %} active{% endif %}" href="{{ '/docs/security-identity/' | relative_url }}">Security and Identity</a>
            <a class="nav-link nav-link-small{% if page.path == 'docs/application-platform.md' %} active{% endif %}" href="{{ '/docs/application-platform/' | relative_url }}">Application Platform</a>
            <a class="nav-link nav-link-small{% if page.path == 'docs/desktop.md' or page.path contains 'docs/desktop-' %} active{% endif %}" href="{{ '/docs/desktop/' | relative_url }}">Desktop Environment</a>
            <a class="nav-link nav-link-small{% if page.path == 'docs/diagnostics-recovery.md' %} active{% endif %}" href="{{ '/docs/diagnostics-recovery/' | relative_url }}">Diagnostics and Recovery</a>
          </details>
        </nav>
      </aside>

      <main class="content">
        <article>
          {{ content }}
        </article>
      </main>
    </div>

    <script>
      const toggle = document.querySelector('.navigation-toggle');
      const navigation = document.querySelector('#site-navigation');
      toggle.addEventListener('click', () => {
        const open = navigation.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open);
      });
    </script>
  </body>
</html>
