[tools]
ruby = "3.3.4"

[tasks.install]
description = "Install the documentation dependencies"
run = "bundle install"

[tasks."wiki:clone"]
description = "Clone the canonical Wiki content"
run = "test -d wiki/.git || git clone git@github.com:shapebit-software/docs.wiki.git wiki"

[tasks.prepare]
description = "Prepare the Wiki content for Jekyll"
depends = ["wiki:clone"]
run = "scripts/prepare-site wiki .jekyll-source"

[tasks.serve]
description = "Preview the documentation site locally"
depends = ["install", "prepare"]
run = "bundle exec jekyll serve --source .jekyll-source"

[tasks.build]
description = "Build the documentation site"
depends = ["install", "prepare"]
run = "bundle exec jekyll build --source .jekyll-source --trace"
